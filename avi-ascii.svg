<svg xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="702"
    viewBox="0 0 500 702"
    role="img">

    <title>Animated ASCII portrait</title>

    <style>
        .ascii {
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;

            font-size: 8px;
            font-weight: 400;
            fill: #b8b8b8;

            white-space: pre;
        }

        .row {
            opacity: 0;
            animation:
                reveal 0.45s
                ease-out forwards;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

